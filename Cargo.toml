[package]
name = "haex-crdt"
version = "0.2.0"
edition = "2021"
description = "SQLite + SQLCipher storage with column-level LWW CRDT sync (uhlc-based HLC). Extracted from haex-vault."
authors = ["Haex"]
repository = "https://github.com/haexmas/haex-crdt"
readme = "README.md"
license = "MIT OR Apache-2.0"

[lib]
name = "haex_crdt"

[features]
default = []
# Exposes `Database::with_connection(&rusqlite::Connection)` on the public API.
# Requires that all downstream consumers link the exact same `rusqlite`
# version this crate resolves to. See README §rusqlite version contract.
raw-connection = []
# Enables deprecated compatibility shims used by pre-extraction test
# fixtures in downstream consumers (currently haex-vault). Adds a
# `blake3` dependency. Not enabled by default; consumers that do not opt
# in pay no cost.
test-shims = ["dep:blake3"]

[dependencies]
rusqlite = { version = "0.40", features = [
    "bundled-sqlcipher-vendored-openssl",
    "functions",
    "hooks",
] }
uhlc = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
sqlparser = { version = "0.62", features = ["visitor"] }
thiserror = "2.0"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
# Optional; only pulled in by the `test-shims` feature.
blake3 = { version = "1.5", optional = true }

[dev-dependencies]
tempfile = "3"

# Plan §8 acceptance test — exercises `Database::open` through
# `apply_remote_changes` end-to-end across two independent stores, using
# `with_connection` for the local writes. Gated behind `raw-connection`
# because the writes route through the raw `rusqlite::Connection`.
[[test]]
name = "end_to_end"
path = "tests/end_to_end.rs"
required-features = ["raw-connection"]
